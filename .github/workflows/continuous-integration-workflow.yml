name: AccessiUI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Tier 1 assertions (plan section 22.1): contrast across the token
      # matrix, accessible names, roles and states, semantics. Cheap and
      # exhaustive, so they run on every commit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
