name: AccessiUI CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Tier 1 assertions (plan section 22.1): contrast across the token
      # matrix, accessible names, roles and states, semantics. Cheap and
      # exhaustive, so they run on every commit.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Browser tier (plan sections 21.2, 21.4). Split from `verify` because it
  # needs a browser download and takes noticeably longer. These assert the
  # things jsdom structurally cannot: rendered target size, reflow at 320px
  # and 200% text, keyboard-only operation, focus visibility, and whether
  # feedback lands close enough to its control for a magnifier user to see it.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
